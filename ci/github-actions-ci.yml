name: FlowForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      VITE_SUPABASE_URL: https://rnkaowxaaxdzumliicku.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key-ci
      SUPABASE_URL: https://rnkaowxaaxdzumliicku.supabase.co
      SUPABASE_ANON_KEY: test-anon-key-ci
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-ci
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npx tsc --noEmit

      - name: ESLint Code Quality
        run: npm run lint

      - name: Vitest Suite (Unit, Integration & SSRF Tests)
        run: npm test

      - name: Production Client Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright End-to-End Suite
        run: npm run test:e2e

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
